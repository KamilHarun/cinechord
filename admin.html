<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineChord Admin Panel</title>
    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', sans-serif; }
        
        /* LOGIN EKRANI */
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #1e1e2f; z-index: 9999; display: flex; align-items: center; justify-content: center;
        }
        .login-box { background: white; padding: 40px; border-radius: 10px; width: 350px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }

        /* ADMIN PANEL */
        .wrapper { display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 260px; background: #212529; color: white; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { padding: 20px; font-size: 20px; font-weight: bold; border-bottom: 1px solid #3d4146; }
        .nav-link { color: #babbbc; padding: 15px 20px; cursor: pointer; display: block; text-decoration: none; border-left: 4px solid transparent; }
        .nav-link:hover, .nav-link.active { background: #343a40; color: white; border-left-color: #0d6efd; }
        
        .main-content { flex-grow: 1; padding: 30px; overflow-y: auto; display: none; }
        .main-content.active { display: block; animation: fadeEffect 0.3s; }
        
        @keyframes fadeEffect { from {opacity: 0;} to {opacity: 1;} }
        
        img.thumb { width: 60px; height: 60px; object-fit: cover; border-radius: 5px; border: 1px solid #ddd; }
        .badge-read { background-color: #d1fae5; color: #065f46; }
        .badge-unread { background-color: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>

    <!-- 1. LOGIN EKRANI -->
    <div id="login-overlay">
        <div class="login-box text-center">
            <h3 class="mb-4"><i class="fas fa-lock me-2"></i>Admin Giriş</h3>
            <form id="loginForm">
                <div class="mb-3 text-start">
                    <label>İstifadəçi adı</label>
                    <input type="text" id="loginUser" class="form-control" placeholder="admin" required>
                </div>
                <div class="mb-3 text-start">
                    <label>Şifrə</label>
                    <input type="password" id="loginPass" class="form-control" placeholder="******" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Daxil ol</button>
            </form>
        </div>
    </div>

    <!-- 2. ƏSAS PANEL -->
    <div class="wrapper" id="admin-wrapper" style="display: none;">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header"><i class="fas fa-video me-2"></i>CineChord</div>
            <a onclick="nav('works')" class="nav-link active" id="link-works"><i class="fas fa-film me-2"></i> İşlər (Works)</a>
            <a onclick="nav('services')" class="nav-link" id="link-services"><i class="fas fa-tools me-2"></i> Xidmətlər</a>
            <a onclick="nav('messages')" class="nav-link" id="link-messages"><i class="fas fa-envelope me-2"></i> Mesajlar</a>
            <a onclick="nav('about')" class="nav-link" id="link-about"><i class="fas fa-info-circle me-2"></i> About</a>
            <div class="mt-auto p-3">
                <button onclick="logout()" class="btn btn-outline-danger w-100 btn-sm">Çıxış</button>
            </div>
        </div>

        <!-- Məzmun -->
        <div style="flex-grow: 1; display: flex; flex-direction: column;">
            
            <!-- WORKS BÖLMƏSİ -->
            <div id="view-works" class="main-content active">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Portfolio İşləri</h2>
                    <button class="btn btn-primary" onclick="openWorkModal()"><i class="fas fa-plus"></i> Yeni İş</button>
                </div>
                <div class="card shadow-sm">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark"><tr><th class="ps-4">Şəkil</th><th>Başlıq</th><th>Müştəri</th><th>Kateqoriya</th><th>Əməliyyat</th></tr></thead>
                        <tbody id="worksTable"></tbody>
                    </table>
                </div>
            </div>

            <!-- SERVICES BÖLMƏSİ -->
            <div id="view-services" class="main-content">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Xidmətlər</h2>
                    <button class="btn btn-primary" onclick="openServiceModal()"><i class="fas fa-plus"></i> Yeni Xidmət</button>
                </div>
                <div class="row" id="servicesGrid"></div>
            </div>

            <!-- MESSAGES BÖLMƏSİ -->
            <div id="view-messages" class="main-content">
                <h2 class="mb-4">Gələn Mesajlar</h2>
                <div class="card shadow-sm">
                    <table class="table table-hover align-middle">
                        <thead class="table-dark"><tr><th>Status</th><th>Ad</th><th>Email</th><th>Mesaj</th><th>Əməliyyat</th></tr></thead>
                        <tbody id="messagesTable"></tbody>
                    </table>
                </div>
            </div>

            <!-- ABOUT BÖLMƏSİ -->
            <div id="view-about" class="main-content">
                <h2 class="mb-4">Haqqımızda Məlumatları</h2>
                <div class="card shadow-sm p-4">
                    <form id="aboutForm">
                        <div class="row g-3">
                            <div class="col-md-6"><label>Main Title</label><input type="text" id="aboutTitle" class="form-control"></div>
                            <div class="col-md-6"><label>Sub Title</label><input type="text" id="aboutSubtitle" class="form-control"></div>
                            <div class="col-12"><label>Who We Are Text</label><textarea id="aboutWho" class="form-control" rows="3"></textarea></div>
                            <div class="col-12"><label>Our Mission Text</label><textarea id="aboutMission" class="form-control" rows="3"></textarea></div>
                            <div class="col-md-4"><label>Email</label><input type="text" id="aboutEmail" class="form-control"></div>
                            <div class="col-md-4"><label>Phone</label><input type="text" id="aboutPhone" class="form-control"></div>
                            <div class="col-md-4"><label>Address</label><input type="text" id="aboutAddress" class="form-control"></div>
                            <div class="col-12"><button type="button" onclick="saveAbout()" class="btn btn-success">Yadda Saxla</button></div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- WORK MODAL -->
    <div class="modal fade" id="workModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white"><h5 class="modal-title">İş Formu</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <form id="workForm">
                        <input type="hidden" id="workId">
                        <div class="mb-2"><label>Başlıq</label><input type="text" id="wTitle" class="form-control" required></div>
                        <div class="mb-2"><label>Müştəri</label><input type="text" id="wClient" class="form-control"></div>
                        <div class="mb-2"><label>Kateqoriya</label>
                            <select id="wCategory" class="form-select" required>
                                <option value="FILM">FILM</option><option value="COMMERCIAL">COMMERCIAL</option><option value="CLIP">CLIP</option>
                            </select>
                        </div>
                        <div class="mb-2"><label>Video Link</label><input type="text" id="wVideoUrl" class="form-control"></div>
                        <div class="mb-2"><label>Şəkil</label><input type="file" id="wImage" class="form-control"></div>
                        <div class="mb-2"><label>Preview Video (Fayl)</label><input type="file" id="wPreview" class="form-control"></div>
                    </form>
                </div>
                <div class="modal-footer"><button type="button" class="btn btn-primary" onclick="submitWork()">Təsdiqlə</button></div>
            </div>
        </div>
    </div>

    <!-- SERVICE MODAL -->
    <div class="modal fade" id="serviceModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-success text-white"><h5 class="modal-title">Xidmət Formu</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <form id="serviceForm">
                        <input type="hidden" id="serviceId">
                        <div class="mb-2"><label>Başlıq</label><input type="text" id="sTitle" class="form-control" required></div>
                        <div class="mb-2"><label>Icon Class</label><input type="text" id="sIcon" class="form-control" placeholder="fa-video"></div>
                        <div class="mb-2"><label>Təsvir</label><textarea id="sDesc" class="form-control"></textarea></div>
                        <div class="mb-2"><label>Bullet Points (Hər sətir 1 ədəd)</label><textarea id="sBullets" class="form-control" rows="3"></textarea></div>
                        <div class="mb-2"><label>Steps (Hər sətir 1 ədəd)</label><textarea id="sSteps" class="form-control" rows="3"></textarea></div>
                    </form>
                </div>
                <div class="modal-footer"><button type="button" class="btn btn-success" onclick="submitService()">Təsdiqlə</button></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ======= KONFİQURASİYA =======
        const BASE_URL = "http://localhost:8080";
        // Sizin atdığınız controllerlərə uyğun dəqiq URL-lər:
        const API = {
            LOGIN: `${BASE_URL}/api/auth/login`,
            WORKS: `${BASE_URL}/admin`, // getAllWorks, createWork...
            SERVICES: `${BASE_URL}/admin/services`,
            CONTACTS: `${BASE_URL}/admin/contacts`,
            ABOUT: `${BASE_URL}/about` // Diqqət: /admin/about deyil, /about
        };

        let token = localStorage.getItem('jwt_token');

        // ======= AUTH & INIT =======
        function checkAuth() {
            if(!token) {
                document.getElementById('login-overlay').style.display = 'flex';
                document.getElementById('admin-wrapper').style.display = 'none';
            } else {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('admin-wrapper').style.display = 'flex';
                nav('works'); // İlk açılışda işləri yüklə
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('loginUser').value;
            const password = document.getElementById('loginPass').value;

            try {
                const res = await fetch(API.LOGIN, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });

                if(res.ok) {
                    const data = await res.json();
                    token = data.token || data.accessToken; // Tokeni götürürük
                    localStorage.setItem('jwt_token', token);
                    checkAuth();
                } else {
                    alert("Giriş uğursuz oldu! İstifadəçi adı və ya şifrə səhvdir.");
                }
            } catch(err) { console.error(err); alert("Server xətası!"); }
        });

        function logout() {
            localStorage.removeItem('jwt_token');
            location.reload();
        }

        // Fetch köməkçisi (Token avtomatik əlavə olunur)
        async function authFetch(url, options = {}) {
            if(!options.headers) options.headers = {};
            // FormData göndərərkən Content-Type 'multipart/form-data' avtomatik qoyulur, əl ilə yazmırıq
            if(!(options.body instanceof FormData)) {
                options.headers['Content-Type'] = 'application/json';
            }
            options.headers['Authorization'] = `Bearer ${token}`;

            const res = await fetch(url, options);
            if(res.status === 401) { logout(); return; } // Token vaxtı bitibsə atır
            return res;
        }

        // ======= NAVIGATION =======
        function nav(page) {
            document.querySelectorAll('.main-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.sidebar a').forEach(el => el.classList.remove('active'));
            
            document.getElementById('view-' + page).classList.add('active');
            document.getElementById('link-' + page).classList.add('active');

            if(page === 'works') loadWorks();
            if(page === 'services') loadServices();
            if(page === 'messages') loadMessages();
            if(page === 'about') loadAbout();
        }

        // ======= WORKS (FormData ilə) =======
        async function loadWorks() {
            try {
                // Sizin kod: getAllWorks (Pageable)
                const res = await authFetch(`${API.WORKS}/getAllWorks`);
                const data = await res.json();
                const list = data.content ? data.content : data;
                
                const tbody = document.getElementById('worksTable');
                tbody.innerHTML = '';
                list.forEach(w => {
                    // Şəkil URL-i tam deyilsə, /uploads əlavə edirik
                    let imgUrl = w.imageUrl;
                    if(imgUrl && !imgUrl.startsWith('http')) imgUrl = `${BASE_URL}/uploads/${imgUrl}`;
                    
                    tbody.innerHTML += `
                        <tr>
                            <td class="ps-4"><img src="${imgUrl || '#'}" class="thumb"></td>
                            <td>${w.title}</td>
                            <td>${w.clientName || '-'}</td>
                            <td><span class="badge bg-secondary">${w.category}</span></td>
                            <td>
                                <button class="btn btn-sm btn-info" onclick='editWork(${JSON.stringify(w)})'><i class="fas fa-edit"></i></button>
                                <button class="btn btn-sm btn-danger" onclick="deleteWork(${w.id})"><i class="fas fa-trash"></i></button>
                            </td>
                        </tr>`;
                });
            } catch(e) { console.error(e); }
        }

        async function submitWork() {
            const id = document.getElementById('workId').value;
            const formData = new FormData();
            
            formData.append('title', document.getElementById('wTitle').value);
            formData.append('clientName', document.getElementById('wClient').value);
            formData.append('category', document.getElementById('wCategory').value);
            formData.append('videoUrl', document.getElementById('wVideoUrl').value);
            
            const img = document.getElementById('wImage').files[0];
            if(img) formData.append('imageFile', img);
            
            const vid = document.getElementById('wPreview').files[0];
            if(vid) formData.append('previewVideoFile', vid);

            let url = id ? `${API.WORKS}/${id}` : `${API.WORKS}/createWork`;
            let method = id ? 'PUT' : 'POST';

            const res = await authFetch(url, { method, body: formData });
            if(res.ok) {
                bootstrap.Modal.getInstance(document.getElementById('workModal')).hide();
                loadWorks();
            } else { alert("Xəta baş verdi!"); }
        }

        function editWork(w) {
            document.getElementById('workForm').reset();
            document.getElementById('workId').value = w.id;
            document.getElementById('wTitle').value = w.title;
            document.getElementById('wClient').value = w.clientName || '';
            document.getElementById('wCategory').value = w.category;
            document.getElementById('wVideoUrl').value = w.videoUrl || '';
            new bootstrap.Modal(document.getElementById('workModal')).show();
        }

        function openWorkModal() {
            document.getElementById('workForm').reset();
            document.getElementById('workId').value = '';
            new bootstrap.Modal(document.getElementById('workModal')).show();
        }

        async function deleteWork(id) {
            if(confirm('Silmək istədiyinizə əminsiniz?')) {
                // Sizin kodda: /deleteWork{id} yazılıb, slash-a diqqət edin
                await authFetch(`${API.WORKS}/deleteWork/${id}`, { method: 'DELETE' });
                loadWorks();
            }
        }

        // ======= SERVICES (JSON ilə) =======
        async function loadServices() {
            const res = await authFetch(API.SERVICES); // GET /admin/services
            const list = await res.json();
            const grid = document.getElementById('servicesGrid');
            grid.innerHTML = '';
            list.forEach(s => {
                grid.innerHTML += `
                    <div class="col-md-4 mb-3">
                        <div class="card h-100 p-3 shadow-sm">
                            <h5><i class="${s.iconClass} text-primary me-2"></i>${s.title}</h5>
                            <p class="small text-muted">${s.description}</p>
                            <div class="mt-auto">
                                <button class="btn btn-sm btn-outline-primary" onclick='editService(${JSON.stringify(s)})'>Düzəlt</button>
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteService(${s.id})">Sil</button>
                            </div>
                        </div>
                    </div>`;
            });
        }

        async function submitService() {
            const id = document.getElementById('serviceId').value;
            const data = {
                title: document.getElementById('sTitle').value,
                iconClass: document.getElementById('sIcon').value,
                description: document.getElementById('sDesc').value,
                // Textarea-nı sətirlərə bölüb array edirik
                bulletPoints: document.getElementById('sBullets').value.split('\n').filter(x=>x.trim()),
                processSteps: document.getElementById('sSteps').value.split('\n').filter(x=>x.trim())
            };

            let url = id ? `${API.SERVICES}/${id}` : API.SERVICES;
            let method = id ? 'PUT' : 'POST';

            const res = await authFetch(url, { method, body: JSON.stringify(data) });
            if(res.ok) {
                bootstrap.Modal.getInstance(document.getElementById('serviceModal')).hide();
                loadServices();
            }
        }

        function editService(s) {
            document.getElementById('serviceId').value = s.id;
            document.getElementById('sTitle').value = s.title;
            document.getElementById('sIcon').value = s.iconClass;
            document.getElementById('sDesc').value = s.description;
            // Array-i textarea üçün stringə çeviririk
            document.getElementById('sBullets').value = s.bulletPoints ? s.bulletPoints.join('\n') : '';
            document.getElementById('sSteps').value = s.processSteps ? s.processSteps.join('\n') : '';
            new bootstrap.Modal(document.getElementById('serviceModal')).show();
        }

        function openServiceModal() {
            document.getElementById('serviceForm').reset();
            document.getElementById('serviceId').value = '';
            new bootstrap.Modal(document.getElementById('serviceModal')).show();
        }

        async function deleteService(id) {
            if(confirm('Silinsin?')) {
                await authFetch(`${API.SERVICES}/${id}`, { method: 'DELETE' });
                loadServices();
            }
        }

        // ======= MESSAGES =======
        async function loadMessages() {
            const res = await authFetch(`${API.CONTACTS}/allMessages`);
            const list = await res.json();
            const tbody = document.getElementById('messagesTable');
            tbody.innerHTML = '';
            list.forEach(m => {
                tbody.innerHTML += `
                    <tr>
                        <td><span class="badge ${m.isRead ? 'badge-read' : 'badge-unread'}">${m.isRead ? 'Oxundu' : 'Yeni'}</span></td>
                        <td>${m.name}</td>
                        <td>${m.email}</td>
                        <td title="${m.message}">${m.message.substring(0, 40)}...</td>
                        <td>
                            ${!m.isRead ? `<button class="btn btn-sm btn-success me-1" onclick="markRead(${m.id})"><i class="fas fa-check"></i></button>` : ''}
                            <button class="btn btn-sm btn-danger" onclick="deleteMessage(${m.id})"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>`;
            });
        }

        async function markRead(id) {
            await authFetch(`${API.CONTACTS}/${id}/read`, { method: 'PATCH' });
            loadMessages();
        }

        async function deleteMessage(id) {
            if(confirm('Mesaj silinsin?')) {
                await authFetch(`${API.CONTACTS}/${id}`, { method: 'DELETE' });
                loadMessages();
            }
        }

        // ======= ABOUT =======
        async function loadAbout() {
            const res = await authFetch(`${API.ABOUT}/getAbout`);
            const data = await res.json();
            if(data) {
                document.getElementById('aboutTitle').value = data.mainTitle;
                document.getElementById('aboutSubtitle').value = data.subTitle;
                document.getElementById('aboutWho').value = data.whoWeAreText;
                document.getElementById('aboutMission').value = data.ourMissionText;
                document.getElementById('aboutEmail').value = data.email;
                document.getElementById('aboutPhone').value = data.phone;
                document.getElementById('aboutAddress').value = data.address;
            }
        }

        async function saveAbout() {
            const data = {
                mainTitle: document.getElementById('aboutTitle').value,
                subTitle: document.getElementById('aboutSubtitle').value,
                whoWeAreText: document.getElementById('aboutWho').value,
                ourMissionText: document.getElementById('aboutMission').value,
                email: document.getElementById('aboutEmail').value,
                phone: document.getElementById('aboutPhone').value,
                address: document.getElementById('aboutAddress').value
            };
            
            // Backend updateAbout metoduna birbaşa yönləndiririk
            const res = await authFetch(`${API.ABOUT}/updateAbout`, {
                method: 'PUT',
                body: JSON.stringify(data)
            });
            if(res.ok) alert("Haqqımızda məlumatı yeniləndi!");
        }

        // Başlanğıc
        checkAuth();

    </script>
</body>
</html>
