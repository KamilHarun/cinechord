<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes"/>
    <meta name="description" content="Learn about CINE CHORD - Our story, mission, and approach to cinematic storytelling">
    <meta name="theme-color" content="#050505">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>Cine Chord - About</title>
    
    <!-- FAVICON -->
    <link rel="icon" type="image/png" href="../photos/CineChord.png">
    <link rel="shortcut icon" type="image/png" href="../photos/CineChord.png">
    <link rel="apple-touch-icon" href="../photos/CineChord.png">
    
    <link rel="preload" href="../fonts/NeueMetanaNextOutline-Black.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="../fonts/NeueMetanaNext-SemiBold.woff2" as="font" type="font/woff2" crossorigin>
    
    <link rel="stylesheet" href="about.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="grain-overlay"></div>
    <div class="page-transition"></div>
    <div class="progress-bar-top"></div>

    <header class="header">
        <div class="nav-left">
            <a href="../index.html" class="nav-btn" data-text="HOME"><span class="nav-text">HOME</span></a>
            <a href="../works/" class="nav-btn" data-text="WORK"><span class="nav-text">WORK</span></a>
            <a href="../services/" class="nav-btn" data-text="SERVICE"><span class="nav-text">SERVICE</span></a>
        </div>
        <div class="nav-right">
            <a href="../archive/" class="nav-btn" data-text="ARCHIVE"><span class="nav-text">ARCHIVE</span></a>
            <a href="#" class="nav-btn active" data-text="ABOUT"><span class="nav-text">ABOUT</span></a>
            <a href="../contact/" class="nav-btn" data-text="CONTACT"><span class="nav-text">CONTACT</span></a>
        </div>
        
        <!-- Hamburger menu will be dynamically created by about.js -->
    </header>

    <div class="center-logo">
        <img src="../photos/CineChord.png" alt="Cine Chord Logo" class="logo-img">
    </div>

    <div class="container">
        <section class="video-section">
            <div class="video-container">
                <video id="about-video" class="fullscreen-video" autoplay muted loop playsinline preload="auto">
                    Your browser does not support the video tag.
                </video>
                <div class="video-overlay"></div>
            </div>
        </section>

        <section class="content-section">
            <div class="main-content">
                <div class="title-wrapper reveal-item">
                    <h1 id="main-title" class="rolling-title" data-text="OUR STORY">
                        <span>OUR STORY</span>
                    </h1>
                </div>

                <p id="subtitle" class="subtitle reveal-item">Loading...</p>

                <div class="about-content">
                    <div class="about-section reveal-item">
                        <h2 class="section-title">WHO WE ARE</h2>
                        <p id="who-we-are" class="section-text">Loading...</p>
                    </div>

                    <div class="about-section reveal-item">
                        <h2 class="section-title">OUR MISSION</h2>
                        <p id="our-mission" class="section-text">Loading...</p>
                    </div>

                    <div class="about-section reveal-item">
                        <h2 class="section-title">OUR APPROACH</h2>
                        <p id="our-approach" class="section-text">Loading...</p>
                    </div>
                </div>

                <div class="contact-info">
                    <div class="contact-item reveal-item">
                        <span class="contact-label">EMAIL</span>
                        <a id="email-link" href="mailto:" class="rolling-link" data-text="">
                            <span id="email-text"></span>
                        </a>
                    </div>

                    <div class="contact-item reveal-item">
                        <span class="contact-label">ADDRESS</span>
                        <span id="address" class="static-value">Loading...</span>
                    </div>

                    <div class="contact-item reveal-item">
                        <span class="contact-label">PHONE</span>
                        <a id="phone-link" href="tel:" class="rolling-link" data-text="">
                            <span id="phone-text"></span>
                        </a>
                    </div>
                </div>

                <div class="social-links reveal-item">
                    <a href="#" class="social-link" title="INSTAGRAM" aria-label="Instagram">
                        <i class="fab fa-instagram"></i>
                    </a>
                    <a href="#" class="social-link" title="LINKEDIN" aria-label="LinkedIn">
                        <i class="fab fa-linkedin"></i>
                    </a>
                    <a href="#" class="social-link" title="VIMEO" aria-label="Vimeo">
                        <i class="fab fa-vimeo"></i>
                    </a>
                    <a href="#" class="social-link" title="BEHANCE" aria-label="Behance">
                        <i class="fab fa-behance"></i>
                    </a>
                </div>
            </div>
        </section>
    </div>

    <script src="about.js"></script>
</body>
</html>
