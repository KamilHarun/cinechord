<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cine Chord — Behind The Scenes</title>
    <meta name="description" content="Cine Chord — Behind the scenes footage, raw moments and the process behind the work of Director Rauf Gurbanaliyev.">
    <link rel="canonical" href="https://cinechord.az/backstage/">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400;500;600;700;800;900&family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>

    <div class="page-transition"></div>
    <div class="grain-overlay"></div>

    <!-- SCROLL / FOOTAGE GATE -->
    <div class="reel-gate" aria-hidden="true">
        <div class="reel-gate-fill" id="reelGateFill"></div>
    </div>

    <!-- FILM SPROCKET BORDER (bottom only) -->
    <div class="sprocket-strip sprocket-bottom"></div>

    <!-- CUSTOM CURSOR -->
    <div class="cine-cursor" id="cineCursor">
        <span class="cine-cursor-label" id="cineCursorLabel">VIEW</span>
    </div>

    <!-- COUNTDOWN INTRO -->
    <div class="countdown-screen" id="countdownScreen">
        <svg class="countdown-ring" viewBox="0 0 120 120">
            <circle class="countdown-ring-bg" cx="60" cy="60" r="54"></circle>
            <circle class="countdown-ring-fill" id="countdownRingFill" cx="60" cy="60" r="54"></circle>
        </svg>
        <div class="countdown-number" id="countdownNumber">5</div>
        <div class="countdown-label">LOADING REEL</div>
    </div>

    <!-- HEADER (matches home) -->
    <a href="/" class="center-logo">
        <img src="../photos/CineChord.png" alt="Cine Chord Logo" class="logo-img">
    </a>

    <!-- LANGUAGE SELECTOR WITH GLOBE -->
    <div class="lang-selector" id="langSelector">
        <button class="lang-globe-btn" id="langGlobeBtn" aria-label="Language">
            <span class="globe-icon">
                <span class="globe-ellipse"></span>
            </span>
            <span class="current-lang" id="currentLangText">EN</span>
        </button>
        <div class="lang-dropdown" id="langDropdown">
            <button class="lang-option active" data-lang="en">
                <span class="lang-code">EN</span>
                <span class="lang-name">English</span>
                <span class="lang-check"><i class="fa-solid fa-check"></i></span>
            </button>
            <button class="lang-option" data-lang="az">
                <span class="lang-code">AZ</span>
                <span class="lang-name">Azərbaycan</span>
                <span class="lang-check"><i class="fa-solid fa-check"></i></span>
            </button>
        </div>
    </div>

    <button class="hamburger" id="hamburgerBtn" aria-label="Menu">
        <span class="hamburger-text">MENU</span>
        <span class="hamburger-icon">
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
        </span>
    </button>

    <div class="mobile-menu-overlay" id="mobileMenuOverlay"></div>
    <nav class="mobile-menu" id="mobileMenu">
        <a href="/" class="nav-btn" data-text="HOME" data-key="home"><span class="nav-text">HOME</span></a>
        <a href="../works/" class="nav-btn" data-text="WORK" data-key="work"><span class="nav-text">WORK</span></a>
        <a href="../services/" class="nav-btn" data-text="SERVICE" data-key="service"><span class="nav-text">SERVICE</span></a>
        <a href="../archive/" class="nav-btn" data-text="ARCHIVE" data-key="archive"><span class="nav-text">ARCHIVE</span></a>
        <a href="./" class="nav-btn active" data-text="BACKSTAGE" data-key="backstage"><span class="nav-text">BACKSTAGE</span></a>
        <a href="../about/" class="nav-btn" data-text="ABOUT" data-key="about"><span class="nav-text">ABOUT</span></a>
        <a href="../contact/" class="nav-btn" data-text="CONTACT" data-key="contact"><span class="nav-text">CONTACT</span></a>

        <div class="menu-footer">
            <div class="menu-socials">
                <a href="https://www.instagram.com/cine.chord/?hl=en" target="_blank" rel="noopener noreferrer">INSTAGRAM</a>
                <a href="https://www.youtube.com/@cinechordpro" target="_blank" rel="noopener noreferrer">YOUTUBE</a>
                <a href="#">VIMEO</a>
            </div>
            <div class="menu-contact-info">
                <p>info@cinechord.com</p>
                <p>++994 50 233 04 54</p>
            </div>
        </div>
    </nav>

  <!-- CINE STAGE: video-panel elementləri artıq statik deyil.
       script.js səhifə yüklənəndə backend-dən (/api/backstage)
       nə qədər "published" item gəlirsə, o qədər .video-panel
       burada DİNAMİK yaradılıb əlavə edir. Əl ilə panel əlavə/silmə
       etmə — admin paneldən idarə olunur. -->
  <section class="cine-stage" id="cineStage">
    <canvas class="hero-grain" id="heroGrain" aria-hidden="true"></canvas>

    <div class="stage-text" id="stageText">
        <div class="bts-hero-inner">
            <h1 class="bts-title" id="btsTitle">
                <span class="line" data-text="BEHIND"><span class="line-inner">BEHIND</span></span>
                <span class="line accent" data-text="THE SCENE"><span class="line-inner">THE SCENE</span></span>
            </h1>
        </div>
        <div class="scroll-cue">
            <span data-key="scroll">SCROLL</span>
            <div class="scroll-line"><i></i></div>
        </div>

        <!-- WORKS SƏHİFƏSİNƏ KEÇİD -->
        <a href="../works/" class="hero-next-link" aria-label="Görün — Works səhifəsi">
            <span class="hero-next-mask"><span data-text="VIEW OUR WORKS">VIEW OUR WORKS</span></span>
            <i class="fa-solid fa-arrow-right hero-next-arrow" aria-hidden="true"></i>
        </a>
    </div>

    <!-- .video-panel elementləri JS tərəfindən buraya inject olunur -->
  </section>

<!-- VIDEO PREVIEW MODAL (home ilə eyni) -->
<div class="preview-container is-paused" id="previewContainer">
    <button class="close-preview" id="closePreview">×</button>
    <div class="preview-info" id="previewInfo">
        <div class="text-mask">
            <div class="preview-title" id="previewTitle"></div>
        </div>
    </div>
    <div class="video-wrapper" id="videoWrapper">
        <div class="video-loading"></div>

        <div class="modal-play-btn-wrapper is-paused" id="modalPlayBtnContainer">
            <div class="modal-play-btn-inner">
                <img src="../play-btn.png" alt="Play Video" class="modal-play-icon" id="modalPlayIcon">
                <img src="../pause-btn.png" alt="Pause Video" class="modal-play-icon pause-icon" id="modalPauseIcon" style="display:none;">
            </div>
        </div>

        <video id="previewVideo" class="preview-video" playsinline preload="metadata"></video>

        <div class="custom-controls" id="customControls">
            <div class="progress-bar-container" id="progressBarContainer">
                <div class="progress-played" id="progressPlayed"></div>
                <input type="range" class="progress-slider" id="progressSlider" value="0" min="0" max="100" step="0.1">
            </div>
            <div class="controls-buttons">
                <button class="ctrl-btn skip-btn" id="rewindBtn"><i class="fa-solid fa-rotate-left"></i></button>
                <button class="ctrl-btn main-play-btn" id="playPauseBtn">
                    <i class="fa-solid fa-play" id="playIcon"></i>
                    <i class="fa-solid fa-pause" id="pauseIcon" style="display:none;"></i>
                </button>
                <button class="ctrl-btn skip-btn" id="forwardBtn"><i class="fa-solid fa-rotate-right"></i></button>
                <div class="time-display"><span id="currentTime">0:00</span> / <span id="durationTime">0:00</span></div>
                <div class="right-controls-group">
                    <div class="volume-wrapper"><input type="range" class="volume-slider" id="volumeSlider" value="100" min="0" max="100"></div>
                    <button class="ctrl-btn" id="fullscreenBtn"><i class="fa-solid fa-expand"></i></button>
                </div>
            </div>
        </div>
    </div>
</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
