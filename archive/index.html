<!DOCTYPE html>
<html lang="az">
<head>
    <!-- ============================================
         Meta Tags & Basic Configuration
         ============================================ -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CineChord Video Archive - Bütün filmləri, reklam videolarını və layihələri keçin.">
    <meta name="keywords" content="video archive, film, commercial, CineChord">
    <meta name="author" content="CineChord">
    
    <title>CineChord - Archive | Video Archive</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../photos/CineChord.png">
    
    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="archive.css">
</head>
<body>

    <!-- ============================================
         Page Transition Overlay
         ============================================ -->
    <div class="page-transition"></div>
    
    <!-- ============================================
         Grain Texture Overlay
         ============================================ -->
    <div class="grain-overlay"></div>
    
    <!-- ============================================
         Scroll Progress Indicator
         ============================================ -->
    <div class="progress-bar-top"></div>

    <!-- ============================================
         Video Preview Modal (Works Style)
         ============================================ -->
    <div class="preview-container is-paused" id="previewContainer">
        <!-- Close Button -->
        <button class="close-preview" id="closePreview" aria-label="Close video">×</button>
        
        <!-- Video Info -->
        <div class="preview-info" id="previewInfo">
            <div class="text-mask">
                <h2 class="preview-title" id="previewTitle" data-text="PROJECT">PROJECT</h2>
            </div>
            <div class="preview-meta" id="previewMeta"></div>
        </div>

        <!-- Video Wrapper -->
        <div class="video-wrapper" id="videoWrapper">
            <!-- Loading Spinner -->
            <div class="video-loading" aria-label="Loading video"></div>
            
            <!-- Play Button Overlay -->
            <div class="play-button-container modal-play-btn" id="modalPlayBtnContainer">
                <button class="play-button" aria-label="Play video">
                    <span class="play-text" data-text="PLAY">PLAY</span>
                </button>
            </div>
            
            <!-- Video Element -->
            <video 
                id="previewVideo" 
                class="preview-video"
                playsinline
                preload="metadata">
            </video>

            <!-- Custom Video Controls -->
            <div class="custom-controls" id="customControls">
                <!-- Progress Bar -->
                <div class="progress-bar-container" id="progressBarContainer" role="slider" aria-label="Video progress">
                    <div class="progress-played" id="progressPlayed"></div>
                    <input 
                        type="range" 
                        class="progress-slider" 
                        id="progressSlider" 
                        value="0" 
                        min="0" 
                        max="100" 
                        step="0.1"
                        aria-label="Seek video">
                </div>
                
                <!-- Control Buttons -->
                <div class="controls-buttons">
                    <!-- Skip Backward -->
                    <button class="ctrl-btn skip-btn" id="skipBackBtn" title="10 saniyə geri">
                        <i class="fas fa-undo-alt"></i>
                    </button>
                    
                    <!-- Play/Pause -->
                    <button class="ctrl-btn main-play-btn" id="playPauseBtn" aria-label="Play/Pause">
                        <i class="fas fa-play" id="playIcon"></i>
                        <i class="fas fa-pause" id="pauseIcon" style="display:none;"></i>
                    </button>
                    
                    <!-- Skip Forward -->
                    <button class="ctrl-btn skip-btn" id="skipForwardBtn" title="10 saniyə irəli">
                        <i class="fas fa-redo-alt"></i>
                    </button>
                    
                    <!-- Time Display -->
                    <div class="time-display">
                        <span id="currentTime">0:00</span> / <span id="durationTime">0:00</span>
                    </div>
                    
                    <!-- Right Controls -->
                    <div class="right-controls-group">
                        <!-- Volume -->
                        <div class="volume-wrapper">
                            <input 
                                type="range" 
                                class="volume-slider" 
                                id="volumeSlider" 
                                value="100" 
                                min="0" 
                                max="100"
                                aria-label="Volume control">
                        </div>
                        
                        <!-- Speed -->
                        <button class="ctrl-btn speed-btn" id="speedBtn" aria-label="Playback speed">1x</button>
                        
                        <!-- Fullscreen -->
                        <button class="ctrl-btn" id="fullscreenBtn" aria-label="Fullscreen">
                            <i class="fas fa-expand"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ============================================
         Header Navigation
         ============================================ -->
    <header class="header" role="banner">
        <nav class="nav-left" aria-label="Primary navigation">
            <a href="../index.html" class="nav-btn" data-text="HOME">
                <span class="nav-text">HOME</span>
            </a>
            <a href="../works/" class="nav-btn" data-text="WORK">
                <span class="nav-text">WORK</span>
            </a>
            <a href="../services/" class="nav-btn" data-text="SERVICE">
                <span class="nav-text">SERVICE</span>
            </a>
        </nav>
        
        <nav class="nav-right" aria-label="Secondary navigation">
            <a href="#" class="nav-btn active" data-text="ARCHIVE" aria-current="page">
                <span class="nav-text">ARCHIVE</span>
            </a>
            <a href="../about/" class="nav-btn" data-text="ABOUT">
                <span class="nav-text">ABOUT</span>
            </a>
            <a href="../contact/" class="nav-btn" data-text="CONTACT">
                <span class="nav-text">CONTACT</span>
            </a>
        </nav>
    </header>

    <!-- ============================================
         Center Logo
         ============================================ -->
    <div class="center-logo">
        <img src="../photos/CineChord.png" alt="CineChord Logo" class="logo-img">
    </div>

    <!-- ============================================
         Main Archive Section
         ============================================ -->
    <main>
        <section class="archive-section" id="archiveSection">
            <!-- Title Section -->
            <div class="split-titles">
                <!-- Animated Category Words -->
                <div class="video-title" aria-hidden="true">
                    <span class="video-word">FILM</span>
                    <span class="video-word">COMMERCIAL</span>
                    <span class="video-word">CLIPS</span>
                </div>
                
                <!-- Archive Title -->
                <div class="archive-title-container">
                    <h1 class="archive-title">ARCHIVE</h1>
                    <p class="archive-subtitle">
                        FULL FILM AVAILABLE ON REQUEST • 
                        <a href="../contact/">SHOOT A MESSAGE</a>
                    </p>
                </div>
            </div>

            <!-- Archive Table -->
            <table class="archive-table" role="table" aria-label="Video archive">
                <thead>
                    <tr>
                        <th class="number-col" scope="col">#</th>
                        <th class="client-col" scope="col">CLIENT</th>
                        <th class="title-col" scope="col">TITLE</th>
                        <th class="type-col" scope="col">TYPE</th>
                        <th class="location-col" scope="col">LOCATION</th>
                        <th class="agency-col" scope="col">AGENCY</th>
                        <th class="year-col" scope="col">YEAR</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Content will be dynamically loaded by JavaScript -->
                </tbody>
            </table>
        </section>
    </main>

    <!-- ============================================
         Scripts
         ============================================ -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="archive.js"></script>
</body>
</html>
