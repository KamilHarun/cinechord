<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CineChord Video Archive - Bütün filmləri, reklam videolarını və layihələri keçin.">
    <meta name="keywords" content="video archive, film, commercial, CineChord">
    <meta name="author" content="CineChord">
    
    <title>CineChord - Archive | Video Archive</title>
    
    <link rel="icon" type="image/png" href="../photos/CineChord.png">
    <link rel="shortcut icon" type="image/png" href="../photos/CineChord.png">
    <link rel="apple-touch-icon" href="../photos/CineChord.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="archive.css">
</head>
<body>

    <div class="page-transition"></div>
    <div class="grain-overlay"></div>

    <!-- VIDEO MODAL (WORKS STYLE) -->
    <div class="preview-container is-paused" id="previewContainer">
        <button class="close-preview" id="closePreview">×</button>
        
        <div class="preview-info" id="previewInfo">
            <div class="text-mask">
                <div class="preview-title" id="previewTitle">PROJECT NAME</div>
            </div>
        </div>
        
        <div class="video-wrapper" id="videoWrapper">
            <div class="video-loading"></div>
            
            <div class="play-button-container modal-play-btn" id="modalPlayBtnContainer">
                <button class="play-button">
                    <span class="play-text" data-text="PLAY">PLAY</span>
                </button>
            </div>
            
            <video id="previewVideo" class="preview-video" playsinline preload="auto"></video>
            
            <div class="custom-controls" id="customControls">
                <div class="progress-bar-container" id="progressBarContainer">
                    <div class="progress-played" id="progressPlayed"></div>
                    <input type="range" class="progress-slider" id="progressSlider" value="0" min="0" max="100" step="0.1">
                </div>
                
                <div class="controls-buttons">
                    <button class="ctrl-btn skip-btn" id="rewindBtn" title="-5s">
                        <i class="fa-solid fa-rotate-left"></i>
                    </button>
                    
                    <button class="ctrl-btn main-play-btn" id="playPauseBtn">
                        <i class="fas fa-play" id="playIcon"></i>
                        <i class="fas fa-pause" id="pauseIcon" style="display:none;"></i>
                    </button>
                    
                    <button class="ctrl-btn skip-btn" id="forwardBtn" title="+5s">
                        <i class="fa-solid fa-rotate-right"></i>
                    </button>
                    
                    <div class="time-display">
                        <span id="currentTime">0:00</span> / <span id="durationTime">0:00</span>
                    </div>
                    
                    <div class="right-controls-group">
                        <div class="volume-wrapper">
                            <input type="range" class="volume-slider" id="volumeSlider" value="100" min="0" max="100">
                        </div>
                        <button class="ctrl-btn speed-btn" id="speedBtn">1x</button>
                        <button class="ctrl-btn" id="fullscreenBtn">
                            <i class="fas fa-expand"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- HAMBURGER BUTTON -->
    <button class="hamburger" id="hamburgerBtn" aria-label="Menu">
        <span class="hamburger-text">MENU</span>
        <span class="hamburger-icon">
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
        </span>
    </button>

    <!-- OVERLAY -->
    <div class="mobile-menu-overlay" id="mobileMenuOverlay"></div>

    <!-- MOBILE MENU -->
   <nav class="mobile-menu" id="mobileMenu">
    <a href="../" class="nav-btn" data-text="HOME"><span class="nav-text">HOME</span></a>
    <a href="../works/" class="nav-btn" data-text="WORK"><span class="nav-text">WORK</span></a>
    <a href="../services/" class="nav-btn" data-text="SERVICE"><span class="nav-text">SERVICE</span></a>
    
    <a href="#" class="nav-btn active" data-text="ARCHIVE"><span class="nav-text">ARCHIVE</span></a>
    
    <a href="../about/" class="nav-btn" data-text="ABOUT"><span class="nav-text">ABOUT</span></a>
    <a href="../contact/" class="nav-btn" data-text="CONTACT"><span class="nav-text">CONTACT</span></a>

    <div class="menu-footer">
        <div class="menu-socials">
            <a href="#">INSTAGRAM</a>
            <a href="#">YOUTUBE</a>
            <a href="#">VIMEO</a>
        </div>
        <div class="menu-contact-info">
            <p>hello@cinechord.com</p>
            <p>+994 50 123 45 67</p>
        </div>
    </div>
</nav>

    <!-- LOGO -->
<a href="../" class="center-logo" title="Home">
    <img src="../photos/CineChord.png" alt="Cine Chord Logo" class="logo-img">
</a>

    <main>
        <section class="archive-section" id="archiveSection">
            <div class="split-titles">
                <div class="video-title" aria-hidden="true">
                    <span class="video-word">FILM</span>
                    <span class="video-word">COMMERCIAL</span>
                    <span class="video-word">CLIPS</span>
                </div>
                
                <div class="archive-title-container">
                    <h1 class="archive-title">ARCHIVE</h1>
                    <p class="archive-subtitle">
                        FULL FILM AVAILABLE ON REQUEST • 
                        <a href="../contact/">SHOOT A MESSAGE</a>
                    </p>
                </div>
            </div>

            <table class="archive-table" role="table" aria-label="Video archive">
                <thead>
                    <tr>
                        <th class="number-col" scope="col">#</th>
                        <th class="client-col" scope="col">CLIENT</th>
                        <th class="title-col" scope="col">TITLE</th>
                        <th class="type-col" scope="col">TYPE</th>
                        <th class="location-col" scope="col">LOCATION</th>
                        <th class="agency-col" scope="col">AGENCY</th>
                        <th class="year-col" scope="col">YEAR</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </section>
    </main>

    <script src="archive.js"></script>
</body>
</html>
