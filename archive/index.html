<!DOCTYPE html>
<html lang="az">
<head>
    <!-- ============================================
         Meta Tags & Basic Configuration
         ============================================ -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Rauf Gurbanaliyev - CineChord video production archive. Browse our complete collection of films, commercials, and creative projects.">
    <meta name="keywords" content="video production, film archive, commercials, CineChord, Rauf Gurbanaliyev">
    <meta name="author" content="CineChord">
    
    <title>CineChord - Archive | CineChord</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../photos/CineChord.png">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="archive.css">
    
    <!-- Preconnect to backend for faster loading -->
    <link rel="preconnect" href="https://cinechord-admin-production.up.railway.app">
</head>
<body>
    <!-- ============================================
         Page Transition Overlay
         ============================================ -->
    <div class="page-transition" aria-hidden="true"></div>
    
    <!-- ============================================
         Grain Texture Overlay
         ============================================ -->
    <div class="grain-overlay" aria-hidden="true"></div>
    
    <!-- ============================================
         Scroll Progress Indicator
         ============================================ -->
    <div class="progress-bar-top" role="progressbar" aria-label="Scroll progress" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>

    <!-- ============================================
         Video Preview Modal
         ============================================ -->
    <div class="preview-container" id="previewContainer" role="dialog" aria-modal="true" aria-labelledby="previewTitle">
        <!-- Close Button -->
        <button class="close-preview" id="closePreview" aria-label="Close video preview">×</button>
        
        <!-- Video Wrapper -->
        <div class="video-wrapper" id="videoWrapper">
            <!-- Loading Spinner -->
            <div class="video-loading" aria-label="Loading video"></div>
            
            <!-- Video Element -->
            <video 
                id="previewVideo" 
                class="preview-video"
                aria-label="Video player"
                playsinline
                preload="metadata">
            </video>
            
            <!-- Custom Video Controls -->
            <div class="custom-controls" id="customControls" role="group" aria-label="Video controls">
                <!-- Progress Bar -->
                <div class="controls-progress">
                    <div class="progress-bar-container" id="progressBarContainer" role="slider" aria-label="Video progress">
                        <div class="progress-buffered" id="progressBuffered" aria-hidden="true"></div>
                        <div class="progress-played" id="progressPlayed" aria-hidden="true"></div>
                        <input 
                            type="range" 
                            class="progress-slider" 
                            id="progressSlider" 
                            value="0" 
                            min="0" 
                            max="100" 
                            step="0.1"
                            aria-label="Seek video">
                    </div>
                </div>
                
                <!-- Control Buttons -->
                <div class="controls-buttons">
                    <!-- Play/Pause Button -->
                    <button class="ctrl-btn" id="playPauseBtn" aria-label="Play/Pause">
                        <svg id="playIcon" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                            <path fill="currentColor" d="M8 5v14l11-7z"/>
                        </svg>
                        <svg id="pauseIcon" viewBox="0 0 24 24" width="24" height="24" style="display:none;" aria-hidden="true">
                            <path fill="currentColor" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                        </svg>
                    </button>
                    
                    <!-- Skip Backward Button -->
                    <button class="ctrl-btn" id="skipBackBtn" title="10 saniyə geri" aria-label="Skip backward 10 seconds">
                        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                            <path fill="currentColor" d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/>
                        </svg>
                    </button>
                    
                    <!-- Skip Forward Button -->
                    <button class="ctrl-btn" id="skipForwardBtn" title="10 saniyə irəli" aria-label="Skip forward 10 seconds">
                        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                            <path fill="currentColor" d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/>
                        </svg>
                    </button>
                    
                    <!-- Time Display -->
                    <div class="time-display" aria-live="polite">
                        <span id="currentTime">0:00</span>
                        <span class="time-separator" aria-hidden="true">/</span>
                        <span id="durationTime">0:00</span>
                    </div>
                    
                    <!-- Volume Controls -->
                    <div class="volume-wrapper">
                        <button class="ctrl-btn" id="muteBtn" aria-label="Mute/Unmute">
                            <svg id="volumeIcon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                                <path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                            </svg>
                            <svg id="muteIcon" viewBox="0 0 24 24" width="20" height="20" style="display:none;" aria-hidden="true">
                                <path fill="currentColor" d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                            </svg>
                        </button>
                        <input 
                            type="range" 
                            class="volume-slider" 
                            id="volumeSlider" 
                            value="100" 
                            min="0" 
                            max="100"
                            aria-label="Volume control">
                    </div>
                    
                    <!-- Speed Control Button -->
                    <button class="ctrl-btn speed-btn" id="speedBtn" aria-label="Playback speed">1x</button>
                    
                    <!-- Fullscreen Button -->
                    <button class="ctrl-btn" id="fullscreenBtn" aria-label="Fullscreen">
                        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                            <path fill="currentColor" d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Video Information -->
        <div class="preview-info" id="previewInfo">
            <div class="preview-title" id="previewTitle"></div>
            <div class="preview-meta" id="previewMeta"></div>
        </div>
    </div>

    <!-- ============================================
         Header Navigation
         ============================================ -->
    <header class="header" role="banner">
        <nav class="nav-left" aria-label="Primary navigation">
            <a href="../index.html" class="nav-btn" data-text="HOME">
                <span class="nav-text">HOME</span>
            </a>
            <a href="../works/" class="nav-btn" data-text="WORK">
                <span class="nav-text">WORK</span>
            </a>
            <a href="../services/" class="nav-btn" data-text="SERVICE">
                <span class="nav-text">SERVICE</span>
            </a>
        </nav>
        
        <nav class="nav-right" aria-label="Secondary navigation">
            <a href="#" class="nav-btn active" data-text="ARCHIVE" aria-current="page">
                <span class="nav-text">ARCHIVE</span>
            </a>
            <a href="../about/" class="nav-btn" data-text="ABOUT">
                <span class="nav-text">ABOUT</span>
            </a>
            <a href="../contact/" class="nav-btn" data-text="CONTACT">
                <span class="nav-text">CONTACT</span>
            </a>
        </nav>
    </header>

    <!-- ============================================
         Center Logo
         ============================================ -->
    <div class="center-logo" aria-hidden="true">
        <img src="/photos/CineChord.png" alt="CineChord Logo" class="logo-img">
    </div>

    <!-- ============================================
         Main Archive Section
         ============================================ -->
    <main>
        <section class="archive-section" id="archiveSection" aria-labelledby="archiveTitle">
            <!-- Title Section -->
            <div class="split-titles">
                <!-- Animated Category Words -->
                <div class="video-title" aria-hidden="true">
                    <span class="video-word">FILM</span>
                    <span class="video-word">COMMERCIAL</span>
                    <span class="video-word">CLIPS</span>
                </div>
                
                <!-- Archive Title -->
                <div class="archive-title-container">
                    <h1 class="archive-title" id="archiveTitle">ARCHIVE</h1>
                    <p class="archive-subtitle">
                        FULL FILM AVAILABLE ON REQUEST, 
                        <a href="../contact/">SHOOT A MESSAGE</a>
                    </p>
                </div>
            </div>

            <!-- Archive Table -->
            <table class="archive-table" role="table" aria-label="Video archive">
                <thead>
                    <tr>
                        <th class="number-col" scope="col">#</th>
                        <th class="client-col" scope="col">CLIENT</th>
                        <th class="title-col" scope="col">TITLE</th>
                        <th class="type-col" scope="col">TYPE</th>
                        <th class="location-col" scope="col">LOCATION</th>
                        <th class="agency-col" scope="col">AGENCY</th>
                        <th class="year-col" scope="col">YEAR</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Content will be dynamically loaded by JavaScript -->
                </tbody>
            </table>
        </section>
    </main>

    <!-- ============================================
         JavaScript
         ============================================ -->
    <script src="archive.js"></script>
</body>
</html>
