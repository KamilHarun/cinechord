<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cine Chord — Works</title>
    
    <!-- FAVICON -->
    <link rel="icon" type="image/png" href="../photos/CineChord.png">
    <link rel="shortcut icon" type="image/png" href="../photos/CineChord.png">
    <link rel="apple-touch-icon" href="../photos/CineChord.png">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="works.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        .projects-grid { min-height: 300px; }
        .preview-container { display: none; opacity: 0; }
        .loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; display: flex;
            justify-content: center; align-items: center;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>
    
    <div class="loading-screen">
        <div class="loader-content"></div>
    </div>

    <div class="page-transition"></div>
    <div class="grain-overlay"></div>
    <div class="progress-bar-top"></div>

    <header class="header">
        <div class="nav-left">
            <a href="../index.html" class="nav-btn" data-text="HOME"><span class="nav-text">HOME</span></a>
            <a href="#" class="nav-btn active" data-text="WORK"><span class="nav-text">WORK</span></a>
            <a href="../services/" class="nav-btn" data-text="SERVICE"><span class="nav-text">SERVICE</span></a>
        </div>
        <div class="nav-right">
            <a href="../archive/" class="nav-btn" data-text="ARCHIVE"><span class="nav-text">ARCHIVE</span></a>
            <a href="../about/" class="nav-btn" data-text="ABOUT"><span class="nav-text">ABOUT</span></a>
            <a href="../contact/" class="nav-btn" data-text="CONTACT"><span class="nav-text">CONTACT</span></a>
        </div>
   <div class="center-logo">
        <img src="../photos/CineChord.png" class="logo-img">
    </div>
</header>

    <div class="preview-container is-paused" id="previewContainer">
        <button class="close-preview" id="closePreview">×</button>
        <div class="preview-info" id="previewInfo">
            <div class="text-mask">
                <div class="preview-title" id="previewTitle">PROJECT NAME</div>
            </div>
        </div>
        <div class="video-wrapper" id="videoWrapper">
            <div class="video-loading"></div>
            <div class="play-button-container modal-play-btn" id="modalPlayBtnContainer">
                <button class="play-button">
                    <span class="play-text" data-text="PLAY">PLAY</span>
                </button>
            </div>
            <video id="previewVideo" class="preview-video" playsinline preload="metadata"></video>
            <div class="custom-controls" id="customControls">
                <div class="progress-bar-container" id="progressBarContainer">
                    <div class="progress-played" id="progressPlayed"></div>
                    <input type="range" class="progress-slider" id="progressSlider" value="0" min="0" max="100" step="0.1">
                </div>
                <div class="controls-buttons">
                    <button class="ctrl-btn skip-btn" id="rewindBtn" title="-5s"><i class="fas fa-undo-alt"></i></button>
                    <button class="ctrl-btn main-play-btn" id="playPauseBtn">
                        <i class="fas fa-play" id="playIcon"></i>
                        <i class="fas fa-pause" id="pauseIcon" style="display:none;"></i>
                    </button>
                    <button class="ctrl-btn skip-btn" id="forwardBtn" title="+5s"><i class="fas fa-redo-alt"></i></button>
                    <div class="time-display">
                        <span id="currentTime">0:00</span> / <span id="durationTime">0:00</span>
                    </div>
                    <div class="right-controls-group">
                        <div class="volume-wrapper">
                            <input type="range" class="volume-slider" id="volumeSlider" value="100" min="0" max="100">
                        </div>
                        <button class="ctrl-btn speed-btn" id="speedBtn">1x</button>
                        <button class="ctrl-btn" id="fullscreenBtn"><i class="fas fa-expand"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <section class="hero-section">
        <div class="hero-bg">
            <video autoplay muted loop playsinline class="hero-video" preload="auto">
                <source src="../videos/Showreel.mp4" type="video/mp4">
            </video>
            <div class="hero-overlay"></div>
        </div>
        <div class="hero-left-title">
            <h2 class="title-main">WORKS</h2>
        </div>
        <div class="hero-right-content">
        </div>
        <a href="#works" class="scroll-down-arrow">
            <span class="arrow-text">Scroll</span>
            <div class="arrow-icon"></div>
        </a>
    </section>

    <section class="category-section">
        <div class="categories-container">
            <button class="category-title category-btn active" onclick="filterWorks('all', this)">ALL</button>
            <button class="category-title category-btn" onclick="filterWorks('films', this)">FILMS</button>
            <button class="category-title category-btn" onclick="filterWorks('commercial', this)">COMMERCIAL</button>
            <button class="category-title category-btn" onclick="filterWorks('clips', this)">CLIPS</button>
        </div>
    </section>

    <section class="works-section" id="works">
        <div class="projects-grid" id="dynamic-projects-grid">
        </div>
    </section>

 <footer class="main-footer">
   <div class="footer-top-cta">
    <a href="../archive/" class="cta-text-link">
        <h2 class="cta-text" data-text="VIEW ALL WORKS">VIEW ALL WORKS</h2>
    </a>
    
    <a href="../archive/" class="cta-button">OPEN ARCHIVE ↗</a>
</div>

    <div class="footer-divider"></div>

    <div class="footer-wrapper">
        <div class="footer-col">
            <span class="footer-label">ADDRESS</span>
            <div class="footer-content">
                <p class="footer-text">Filmmaker LLC</p>
                <p class="footer-text">5th Floor, Suite 580</p>
                <p class="footer-text">Baku, Azerbaijan</p>
            </div>
        </div>

        <div class="footer-col">
            <span class="footer-label">GET IN TOUCH</span>
            <div class="footer-content">
                <a href="mailto:hi@filmmaker.com" class="footer-link mask-link">
                    <span data-text="hi@filmmaker.com">hi@filmmaker.com</span>
                </a>
                <a href="tel:+994500000000" class="footer-link mask-link">
                    <span data-text="(+994) 50 000 00 00">(+994) 50 000 00 00</span>
                </a>
            </div>
        </div>

        <div class="footer-col">
            <span class="footer-label">FOLLOW US</span>
            <div class="social-icons">
                <a href="#" class="mask-icon">
                    <span class="icon-wrap">
                        <i class="fa-brands fa-instagram main-icon"></i>
                        <i class="fa-brands fa-instagram hover-icon"></i>
                    </span>
                </a>
                <a href="#" class="mask-icon">
                    <span class="icon-wrap">
                        <i class="fa-brands fa-youtube main-icon"></i>
                        <i class="fa-brands fa-youtube hover-icon"></i>
                    </span>
                </a>
                <a href="#" class="mask-icon">
                    <span class="icon-wrap">
                        <i class="fa-brands fa-vimeo-v main-icon"></i>
                        <i class="fa-brands fa-vimeo-v hover-icon"></i>
                    </span>
                </a>
                <a href="#" class="mask-icon">
                    <span class="icon-wrap">
                        <i class="fa-brands fa-linkedin-in main-icon"></i>
                        <i class="fa-brands fa-linkedin-in hover-icon"></i>
                    </span>
                </a>
            </div>
        </div>
    </div>

    <div class="footer-bottom">
        <span class="copyright">© 2025 CINE CHORD. ALL RIGHTS RESERVED.</span>
    </div>
</footer>

    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script defer src="works.js"></script>
</body>
</html>
